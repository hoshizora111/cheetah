<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="🐆나는 치타 꿈을 꾸는 치타">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.upd{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:#161C2A;color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.upd button{font:inherit;font-weight:700;padding:6px 12px;border-radius:7px;border:0;background:#FFE14A;color:#3B3200;cursor:pointer}</style>
<title>🐆나는 치타 꿈을 꾸는 치타</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 앱 셸(상단 헤더 + 모바일 하단 탭). 홈은 [남은 순공 · 7일 시간 지도 | 할 일] 2단,
   하루를 24칸 눈금 스트립으로 그리는 스터디 플래너의 타임 트래커가 중심 그림. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA;
  --ink:#161C2A; --ink-2:#586176; --line:#D8DDE8;
  --accent:#2545D3; --on-accent:#FFFFFF;
  --free:#FFE14A; --free-ink:#3B3200; --hl:#FFE14A;
  --fixed:#3D5BE0; --event:#EE6B3B; --meal:#2B9E76;
  --sleep:#C9CFDC; --sleep-2:#B7BECE; --tick:rgba(22,28,42,.16);
  --danger:#BF362B; --on-danger:#FFFFFF;
  --h0:#DC524B; --h1:#E5852A; --h2:#C29A17; --h3:#58A038;
  --h4:#1C9C87; --h5:#3A7ADB; --h6:#8760D4; --h7:#D6578F;
  --tint:24%;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; --hh:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131C; --surface:#171C28; --surface-2:#1E2433;
    --ink:#E8ECF4; --ink-2:#9AA4BA; --line:#2B3346;
    --accent:#93A8FF; --on-accent:#0F131C;
    --free:#DDBF30; --free-ink:#1D1700; --hl:#6A5800;
    --fixed:#7088F5; --event:#F08355; --meal:#4CC498;
    --sleep:#2A3142; --sleep-2:#232A39; --tick:rgba(0,0,0,.38);
    --danger:#FF8D7E; --on-danger:#2A0A06;
    --tint:34%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131C; --surface:#171C28; --surface-2:#1E2433;
  --ink:#E8ECF4; --ink-2:#9AA4BA; --line:#2B3346;
  --accent:#93A8FF; --on-accent:#0F131C;
  --free:#DDBF30; --free-ink:#1D1700; --hl:#6A5800;
  --fixed:#7088F5; --event:#F08355; --meal:#4CC498;
  --sleep:#2A3142; --sleep-2:#232A39; --tick:rgba(0,0,0,.38);
  --danger:#FF8D7E; --on-danger:#2A0A06;
  --tint:34%;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 104px}

/* ── header & tabs ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{flex:none;width:30px;height:12px;border-radius:2px;background:linear-gradient(90deg,var(--sleep) 0 26%,var(--free) 26% 44%,var(--fixed) 44% 62%,var(--free) 62% 78%,var(--event) 78% 88%,var(--free) 88%)}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.sync{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
.sync.is-error{color:var(--danger);text-decoration:underline}
.sleep-btn{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600}
.sleep-btn svg{width:14px;height:14px;flex:none}
.tabs{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab svg{width:18px;height:18px;flex:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-radius:10px;justify-content:center}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:transparent;color:var(--accent)}
}

/* ── shared pieces ── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-head .sub{font-size:12.5px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-sm{padding:6px 10px;font-size:13px}
.empty{color:var(--ink-2);font-size:13.5px;padding:14px 0}
.blk{background:var(--surface-2);background:color-mix(in oklab,var(--hue,var(--ink-2)) var(--tint),var(--surface));color:var(--ink);color:color-mix(in oklab,var(--hue,var(--ink-2)) 30%,var(--ink))}
.hue-0{--hue:var(--h0)}.hue-1{--hue:var(--h1)}.hue-2{--hue:var(--h2)}.hue-3{--hue:var(--h3)}
.hue-4{--hue:var(--h4)}.hue-5{--hue:var(--h5)}.hue-6{--hue:var(--h6)}.hue-7{--hue:var(--h7)}

input[type=text],input[type=date],input[type=time],input[type=number]{
  -webkit-appearance:none;appearance:none;font-size:16px;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
input::placeholder{color:var(--ink-2);opacity:.8}
.field{display:grid;gap:4px;min-width:0}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* ── home ── */
.home{display:grid;gap:22px}
.home > *{min-width:0}
@media (min-width:860px){
  .home{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"hero todos" "timer todos" "map todos";align-items:start;column-gap:28px}
  .home > .hero{grid-area:hero}.home > .timerbox{grid-area:timer}.home > .mapbox{grid-area:map}.home > .todos{grid-area:todos}
}
.hero-days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.hero-days::-webkit-scrollbar{display:none}
.hday{flex:none;padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.hday.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hday b{font-family:var(--mono);font-weight:500;margin-left:4px}
@media (max-width:420px){.hday{padding:4px 8px;font-size:12px}.hday b{margin-left:3px}.hero-days{gap:4px}}
.hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.hero-track::-webkit-scrollbar{display:none}
.hero-card{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.hero-foot .arrows{display:none;gap:4px}
@media (min-width:760px){.hero-foot .arrows{display:flex}}
.hero-label{font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
.hero-num{display:inline;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(44px,13vw,66px);line-height:1.1;letter-spacing:-.04em;padding:0 8px 0 2px;background:linear-gradient(transparent 56%,var(--hl) 56% 90%,transparent 90%)}
.hero-num small{font-family:var(--font);font-size:.3em;font-weight:600;letter-spacing:0;margin:0 .5em 0 .15em}
.hero-num small:last-child{margin-right:0}
.now-line{margin-top:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14.5px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill-free{background:var(--free);color:var(--free-ink)}
.pill-busy{background:var(--ink);color:var(--bg)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stat dt{font-size:12px;color:var(--ink-2)}
.stat dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.stat dd i{font-style:normal;font-size:.72em;color:var(--ink-2);margin-left:1px}
.today-list{margin-top:14px}
.today-list li{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.today-list .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);padding-top:1px}
.today-list .n small{color:var(--ink-2);font-size:12px;margin-left:6px}
.today-list li.past{opacity:.45}
.today-list li.cur .n{font-weight:700}

.map{display:grid;gap:7px}
.map-row{display:grid;grid-template-columns:50px minmax(0,1fr) 62px;align-items:center;gap:10px}
.map-day{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.map-day b{color:var(--ink);font-weight:700;margin-right:4px}
.map-row.is-today .map-day b{color:var(--accent)}
.map-free{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.map-free i{font-style:normal;font-size:.8em;color:var(--ink-2)}
.strip{position:relative;height:22px;background:var(--free);border-radius:3px;overflow:hidden}
.strip::after{content:"";position:absolute;inset:0;background-image:linear-gradient(to right,var(--tick) 1px,transparent 1px);background-size:calc(100% / 24) 100%;pointer-events:none}
.seg{position:absolute;top:0;bottom:0}
.seg-sleep{background:repeating-linear-gradient(135deg,var(--sleep) 0 4px,var(--sleep-2) 4px 8px)}
.seg-fixed{background:var(--fixed)}
.seg-event{background:var(--event)}
.seg-meal{background:var(--meal)}
.strip-past{position:absolute;top:0;bottom:0;left:0;background:var(--surface);opacity:.74}
.nowtick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.axis{position:relative;height:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.axis span{position:absolute;top:0;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}

.todo-add{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;margin-bottom:6px}
.todo-add .f-title{grid-column:1 / -1}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.check{width:24px;height:24px;border:2px solid var(--ink-2);border-radius:7px;margin-top:1px;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent;flex:none}
.check[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.todo-main{width:100%;display:block;min-width:0}
.todo-title{display:block;font-weight:600;overflow-wrap:anywhere}
.todo.done .todo-title{text-decoration:line-through;color:var(--ink-2);font-weight:500}
.todo-meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--ink-2);margin-top:3px;align-items:center}
.dchip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.dchip.soon{background:var(--free);color:var(--free-ink);border-color:transparent}
.dchip.over{background:var(--danger);color:var(--on-danger);border-color:transparent}
.warn{color:var(--danger);font-weight:600}
.done-box{border-top:1px solid var(--line);padding-top:10px}
.done-box summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600}
.done-box .todo:first-of-type{border-top:0}

/* ── timetable ── */
.tt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tt-head,.tt-body{display:grid;grid-template-columns:32px repeat(var(--days),minmax(0,1fr))}
.tt-head div{font-size:12.5px;text-align:center;padding:7px 0;color:var(--ink-2);border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.tt-head div:first-child{border-left:0}
.tt-head .is-today{color:var(--accent);font-weight:700}
.tt-body{position:relative;height:calc(var(--hours) * var(--hh));background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh);background-position:0 -1px}
.tt-times{position:relative}
.tt-times span{position:absolute;right:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:3px}
.tt-col{position:relative;border-left:1px solid var(--line);cursor:cell}
.tt-col.is-today{background:color-mix(in oklab,var(--accent) 6%,transparent)}
.tt-blk{position:absolute;left:1px;right:1px;border-radius:4px;padding:3px 5px;overflow:hidden;font-size:11.5px;line-height:1.28;display:block;cursor:pointer}
.tt-blk b{display:block;font-weight:700;overflow-wrap:anywhere}
.tt-blk small{display:block;font-size:10.5px;opacity:.85;overflow-wrap:anywhere}
.today-list li.off .n{text-decoration:line-through;color:var(--ink-2)}
.wk-range{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);margin-left:6px;white-space:nowrap}
.tt-actions{display:flex;gap:6px;flex-wrap:wrap}
.tt-nav{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.tt-head div b{display:block;font-family:var(--mono);font-size:11px;font-weight:500}
.tt-ev{box-shadow:inset 0 0 0 1.5px var(--hue)}
.tt-off{opacity:.4;text-decoration:line-through}
.tray{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray-h{flex-basis:100%;font-size:12.5px;color:var(--ink-2)}
.tray-item{padding:7px 10px;border-radius:6px;font-size:13px;font-weight:600}
.tray-item .mono{font-weight:500;font-size:12px;margin-right:4px}
.pick{display:grid;gap:8px}
.pick .btn{justify-content:flex-start;padding:12px 14px}
.chk small{color:var(--ink-2);font-size:12px}
.tt-meal{background:var(--surface-2);background:color-mix(in oklab,var(--meal) 16%,var(--surface));color:var(--ink);color:color-mix(in oklab,var(--meal) 45%,var(--ink));border:1px dashed var(--meal)}
.fx-sub.warn{color:var(--danger)}
.conf-box{display:grid;gap:8px}
.conf-box:empty{display:none}
.conf-h{font-size:12.5px;font-weight:600;color:var(--danger)}
.conf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tt-now{position:absolute;left:32px;right:0;height:0;border-top:2px solid var(--ink);pointer-events:none}
.fx-list{margin-top:16px}
.fx{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.fx .dot{width:14px;height:14px;border-radius:4px}
.fx-title{font-weight:600}
.fx-sub{font-size:12.5px;color:var(--ink-2)}

/* ── events ── */
.ev-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-ctl button{padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ev-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.ev-nav .ttl{font-weight:700;font-size:15px;min-width:0;padding:0 6px;white-space:nowrap}
.nav-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.wk-day{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.wk-date{text-align:center;line-height:1.2}
.wk-dow{display:block;font-size:12px;color:var(--ink-2)}
.wk-num{display:inline-block;font-family:var(--mono);font-size:17px;font-weight:600;min-width:30px;padding:2px 0;border-radius:999px}
.wk-day.is-today .wk-num{background:var(--ink);color:var(--bg)}
.wk-items{display:grid;gap:6px;min-width:0}
.wk-none{color:var(--ink-2);font-size:13px;padding-top:6px;opacity:.75}
.ev{display:grid;gap:1px;width:100%;padding:8px 10px;border-radius:6px;min-width:0}
.ev-time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;opacity:.9}
.ev-title{font-weight:700;overflow-wrap:anywhere}
.ev-place{font-size:12.5px;opacity:.85}
.add-mini{width:34px;height:34px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:18px;color:var(--ink-2);line-height:1}
.mg-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--ink-2);text-align:center;padding-bottom:6px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.mc{min-height:66px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;align-items:stretch}
@media (min-width:760px){.mc{min-height:92px;padding:6px}}
.mc-n{font-family:var(--mono);font-size:12px;align-self:flex-start;padding:0 5px;border-radius:999px}
.mc.out .mc-n{color:var(--ink-2);opacity:.5}
.mc.today .mc-n{background:var(--ink);color:var(--bg)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mc-chip{font-size:10.5px;line-height:1.35;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mc-more{font-size:10.5px;color:var(--ink-2);padding-left:2px}
.day-panel{margin-top:16px}

/* ── sheet ── */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100% - 40px);margin:20px auto auto;overflow:auto}
@media (min-width:760px){dialog{margin:auto}}
dialog::backdrop{background:rgba(8,12,22,.55)}
#sheetForm{display:grid;gap:14px;padding:18px}
#sheetForm h2{font-size:17px;font-weight:700}
#sheetForm .hint{font-size:12.5px;color:var(--ink-2);margin-top:-10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:8px;background:var(--hue);border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.slot{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.daychip{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-weight:600;font-size:13.5px;text-align:center}
.daychip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot-time{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 34px;gap:6px;align-items:center}
.rm{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:18px;line-height:1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:13px;font-weight:600}
.sheet-actions{display:flex;gap:8px;align-items:center}
.sheet-actions .sp{flex:1}
.note{font-size:12.5px;color:var(--ink-2)}
/* 순공 타이머 */
.tprog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px}
.tprog i{display:block;height:100%;background:var(--free);border-radius:999px;max-width:100%}
.timer-start{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:var(--surface);color:var(--ink-2)}
.timer-live{display:grid;gap:6px;justify-items:start}
.timer-sub{font-weight:600;display:flex;gap:8px;align-items:center}
.timer-clock{font-family:var(--mono);font-size:clamp(40px,11vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.timer-live.paused .timer-clock{color:var(--ink-2)}
.timer-btns{display:flex;gap:8px;margin-top:4px}
.tlog{margin-top:12px}
.tlog li{display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.tlog .t{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tlog .d{font-family:var(--mono);font-weight:600;white-space:nowrap}
.tlog .n{overflow-wrap:anywhere}
.tstatus{font-size:12.5px;color:var(--ink-2);margin-top:8px}
/* 배경 이미지 모드: 위젯을 반투명하게 */
.bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
.bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.22}
.has-bg .bgimg{display:block}
.has-bg .top{background:color-mix(in srgb,var(--bg) calc(var(--panel-op,.82) * 100%),transparent)}
.has-bg .card,.has-bg .tabs,.has-bg .tt,.has-bg .mg,.has-bg .hero,.has-bg .fx-list,.has-bg #mealList,.has-bg .wk,.has-bg .day-panel{background:color-mix(in srgb,var(--surface) calc(var(--panel-op,.82) * 100%),transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.has-bg .hero,.has-bg .fx-list,.has-bg #mealList,.has-bg .wk,.has-bg .day-panel{padding:16px;border-radius:var(--r);border:1px solid var(--line)}
.bg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bg-thumb{width:64px;height:40px;border-radius:6px;background-size:cover;background-position:center;border:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--accent)}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.02em}
.bk{padding-top:14px;border-top:1px solid var(--line)}
.sleep-rows{display:grid;gap:6px}
.sleep-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.sleep-day{font-size:13px;font-weight:600;white-space:nowrap}
.sleep-day small{display:block;font-weight:400;color:var(--ink-2);font-size:11px}
.bk-row{display:flex;gap:8px;flex-wrap:wrap}
textarea{font-family:var(--mono);font-size:16px;line-height:1.35;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0;resize:vertical;word-break:break-all}
button,input,textarea{touch-action:manipulation}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.daychip,.check{transition:background-color .12s,color .12s}}
</style>
</head>
<body>

<div class="bgimg" id="bgimg" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div>
        <h1>🐆나는 치타 꿈을 꾸는 치타</h1>
        <button type="button" class="sync" id="sync" data-act="retrySync">불러오는 중…</button>

      </button>
      <button class="tab" role="tab" id="tab-timetable" data-act="tab" data-tab="timetable" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>시간표
      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정
      </button>
    </nav>
    <button type="button" class="sleep-btn" data-act="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>설정</span>
    </button>
  </header>

  <main>
    <!-- 지금 -->
    <section id="view-home" class="home" aria-labelledby="tab-home">
      <div class="hero" id="hero"></div>

      <div class="timerbox card" id="timerBox"></div>

      <div class="todos card">
        <div class="sec-head"><h2>남은 할 일</h2><span class="sub" id="todoSummary"></span></div>
        <form class="todo-add" id="todoAdd" autocomplete="off">
          <input class="f-title" type="text" id="todo-new-title" placeholder="예: 경제원론 5–8장 정리" maxlength="80" aria-label="할 일">
          <input type="date" id="todo-new-due" aria-label="마감일 (선택)">
          <input type="number" id="todo-new-est" min="0" max="200" step="0.5" inputmode="decimal" placeholder="예상 h" aria-label="예상 소요 시간(시간, 선택)">
          <button class="btn btn-primary" type="submit">추가</button>
        </form>
        <ul id="todoList"></ul>
        <div id="doneWrap"></div>
      </div>

      <div class="mapbox card">
        <div class="sec-head"><h2>앞으로 7일 시간 지도</h2><span class="sub" id="mapSummary"></span></div>
        <div class="map" id="map"></div>
        <div class="legend" aria-hidden="true">
          <span><i style="background:var(--free)"></i>순공 가능</span>
          <span><i style="background:var(--fixed)"></i>고정 일정</span>
          <span><i style="background:var(--event)"></i>변동 일정</span>
          <span><i style="background:var(--meal)"></i>식사</span>
          <span><i style="background:var(--sleep)"></i>수면</span>
        </div>
      </div>
    </section>

    <!-- 시간표 -->
    <section id="view-timetable" aria-labelledby="tab-timetable" hidden>
      <div class="sec-head">
        <div><h2>주간 시간표<span class="wk-range" id="ttRange"></span></h2><span class="sub" id="ttSummary"></span></div>
        <div class="tt-actions">
          <button type="button" class="btn btn-primary btn-sm" data-act="addFixed">+ 고정 일정</button>
          <button type="button" class="btn btn-sm" data-act="addEvent" data-timed="1">+ 변동 일정</button>
        </div>
      </div>
      <div class="tt-nav">
        <button type="button" class="nav-btn" data-act="ttPrev" aria-label="이전 주">‹</button>
        <button type="button" class="btn btn-sm" data-act="ttToday">이번 주</button>
        <button type="button" class="nav-btn" data-act="ttNext" aria-label="다음 주">›</button>
      </div>
      <div id="ttGrid"></div>
      <div id="ttTray"></div>
      <div class="fx-list" id="fxList"></div>
      <div class="sec-head" style="margin-top:28px">
        <div><h2>식사 시간</h2><span class="sub">순공 시간에서 뺍니다</span></div>
        <button type="button" class="btn btn-sm" data-act="addMeal">+ 식사 시간</button>
      </div>
      <div id="mealList"></div>
    </section>

    <!-- 일정 -->
    <section id="view-events" aria-labelledby="tab-events" hidden>
      <div class="ev-bar">
        <div class="seg-ctl" role="group" aria-label="보기">
          <button type="button" data-act="evView" data-v="week" id="ev-week" aria-pressed="true">주</button>
          <button type="button" data-act="evView" data-v="month" id="ev-month" aria-pressed="false">월</button>
        </div>
        <button type="button" class="btn btn-primary btn-sm" data-act="addEvent">+ 일정</button>
        <div class="ev-nav">
          <button type="button" class="nav-btn" data-act="evPrev" aria-label="이전">‹</button>
          <span class="ttl" id="evTitle"></span>
          <button type="button" class="nav-btn" data-act="evNext" aria-label="다음">›</button>
          <button type="button" class="btn btn-sm" data-act="evToday">오늘</button>
        </div>
      </div>
      <p class="note" style="margin-bottom:8px">매주 반복되는 고정 일정은 여기 나오지 않습니다. 시험·약속처럼 그날만 있는 변동 일정만 보여줍니다. 시간은 나중에 정해도 됩니다.</p>
      <div id="evBody"></div>
    </section>
  </main>
  <footer class="foot">published by jeongwoo kim</footer>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle"><form id="sheetForm" novalidate></form></dialog>

<script>
(function(){
'use strict';

/* ───────── utils ───────── */
var $ = function(s, r){ return (r || document).querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var DOW = ['월','화','수','목','금','토','일'];
var HH = 60;
var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
var isT = function(t){ return typeof t === 'string' && /^\d{2}:\d{2}$/.test(t); };
var isD = function(d){ return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d); };
var toMin = function(t){ if (!isT(t)) return 0; return (+t.slice(0,2)) * 60 + (+t.slice(3,5)); };
var p2 = function(n){ return String(n).padStart(2, '0'); };
var fromMin = function(m){ return p2(Math.floor(m / 60)) + ':' + p2(m % 60); };
var ymd = function(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
var parseYmd = function(s){ return new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10)); };
var sod = function(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
var addDays = function(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
var dowMon = function(d){ return (d.getDay() + 6) % 7; };
var mondayOf = function(d){ return addDays(sod(d), -dowMon(d)); };
var mdLabel = function(d){ return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DOW[dowMon(d)] + ')'; };

function durKo(min){
  min = Math.max(0, Math.round(min));
  var h = Math.floor(min / 60), m = min % 60;
  if (h && m) return h + '시간 ' + m + '분';
  if (h) return h + '시간';
  return m + '분';
}
function durHM(min){
  min = Math.max(0, Math.round(min));
  var h = Math.floor(min / 60), m = min % 60;
  return h + '<i>h</i>' + (m ? ' ' + p2(m) + '<i>m</i>' : '');
}
function unionLen(iv){
  iv.sort(function(a, b){ return a[0] - b[0]; });
  var t = 0, cs = 0, ce = 0, started = false;
  for (var i = 0; i < iv.length; i++){
    var s = iv[i][0], e = iv[i][1];
    if (!started){ cs = s; ce = e; started = true; }
    else if (s > ce){ t += ce - cs; cs = s; ce = e; }
    else if (e > ce){ ce = e; }
  }
  if (started) t += ce - cs;
  return t;
}

/* ───────── state ───────── */
var DEFAULT_SLEEP = { start: '00:00', end: '07:00' };
var DEFAULT_SETTINGS = { sleep: [0,1,2,3,4,5,6].map(function(){ return clone(DEFAULT_SLEEP); }), meals: [] };
var S = { fixed: [], events: [], cuts: [], todos: [], settings: clone(DEFAULT_SETTINGS), study: { active: null, log: [] } };
var DOCS = ['fixed', 'events', 'todos', 'settings', 'study'];
var now0 = new Date();
var ui = {
  tab: 'home', evView: 'week', heroIdx: 0,
  week: mondayOf(now0), ttWeek: mondayOf(now0),
  month: new Date(now0.getFullYear(), now0.getMonth(), 1),
  sel: ymd(now0), doneOpen: false
};

function cleanFixed(a){
  return (Array.isArray(a) ? a : []).filter(function(x){ return x && typeof x === 'object'; }).map(function(x){
    return {
      id: String(x.id || uid()), title: String(x.title || '').slice(0, 80), place: String(x.place || '').slice(0, 80),
      color: Math.abs(x.color | 0) % 8,
      slots: (Array.isArray(x.slots) ? x.slots : []).filter(function(s){ return s && isT(s.start) && isT(s.end) && toMin(s.end) > toMin(s.start); }).map(function(s){
        var days = (Array.isArray(s.days) ? s.days : []).map(Number).filter(function(n){ return n >= 0 && n <= 6 && n % 1 === 0; });
        return { days: days.filter(function(n, i){ return days.indexOf(n) === i; }).sort(), start: s.start, end: s.end };
      })
    };
  });
}
function cleanEvents(a){
  return (Array.isArray(a) ? a : []).filter(function(x){ return x && typeof x === 'object' && isD(x.date); }).map(function(x){
    var timed = !x.allDay && isT(x.start) && isT(x.end) && toMin(x.end) > toMin(x.start);
    return {
      id: String(x.id || uid()), title: String(x.title || '').slice(0, 80), date: x.date, allDay: !timed,
      start: timed ? x.start : '', end: timed ? x.end : '',
      place: String(x.place || '').slice(0, 80), color: Math.abs(x.color | 0) % 8
    };
  });
}
/* 순공 타이머: active = 진행 중인 세션, log = 끝난 세션(최근 60일) */
function cleanStudy(b){
  b = b && typeof b === 'object' ? b : {};
  var a = b.active, floor = ymd(addDays(new Date(), -60));
  var active = (a && typeof a === 'object' && Number(a.startAt) > 0) ? { subject: String(a.subject || '').slice(0, 60), startAt: Number(a.startAt), acc: Math.max(0, Number(a.acc) || 0), running: !!a.running, since: Number(a.since) || Number(a.startAt) } : null;
  var log = (Array.isArray(b.log) ? b.log : []).filter(function(x){ return x && typeof x === 'object' && isD(x.date) && x.date >= floor && Number(x.min) > 0; }).map(function(x){
    return { id: String(x.id || uid()), subject: String(x.subject || '').slice(0, 60), start: Number(x.start) || 0, end: Number(x.end) || 0, min: Math.round(Number(x.min)), date: x.date };
  });
  return { active: active, log: log };
}
function cleanTodos(a){
  return (Array.isArray(a) ? a : []).filter(function(x){ return x && typeof x === 'object'; }).map(function(x){
    var est = Number(x.est); if (!(est > 0)) est = 0;
    return { id: String(x.id || uid()), title: String(x.title || '').slice(0, 120), due: isD(x.due) ? x.due : '', est: Math.round(est), done: !!x.done, doneAt: Number(x.doneAt) || 0 };
  });
}
/* 수면: 요일별 {start,end} 7개. 각 요일 '밤'에 자는 시각과 다음 날 아침 기상 시각.
   예전 저장분(sleepStart/sleepEnd 하나)은 7일에 같은 값으로 옮긴다. */
function cleanSleep(body){
  var base = (isT(body.sleepStart) && isT(body.sleepEnd)) ? { start: body.sleepStart, end: body.sleepEnd } : DEFAULT_SLEEP;
  var arr = Array.isArray(body.sleep) ? body.sleep : [];
  return [0,1,2,3,4,5,6].map(function(d){
    var x = arr[d];
    return (x && isT(x.start) && isT(x.end)) ? { start: x.start, end: x.end } : clone(base);
  });
}
function sleepCfg(d){ return S.settings.sleep[((d % 7) + 7) % 7]; }
/* 어떤 날짜의 수면 구간: 전날 밤 설정에서 이어지는 아침 부분 + 그날 밤 설정의 자정 전 부분 */
function sleepBlocks(date){
  var out = [], dow = dowMon(date), prev = sleepCfg(dow - 1), cur = sleepCfg(dow);
  var pb = toMin(prev.start), pw = toMin(prev.end), cb = toMin(cur.start), cw = toMin(cur.end);
  if (pb !== pw){
    if (pb > pw){ if (pw > 0) out.push({ s: 0, e: pw, type: 'sleep', title: '수면' }); }
    else out.push({ s: pb, e: pw, type: 'sleep', title: '수면' });
  }
  if (cb !== cw && cb > cw) out.push({ s: cb, e: 1440, type: 'sleep', title: '수면' });
  return out;
}
/* 그날만 적용하는 조정: 고정 일정·식사를 하루 빼거나(end ''), 일찍 끝냄(end 'HH:MM') */
function cleanCuts(a){
  var floor = ymd(addDays(new Date(), -21));
  return (Array.isArray(a) ? a : []).filter(function(c){

/* ───────── time math ───────── */
function pushOcc(out, key, b, withOff){
  var c = cutFor(key, b.ref);
  if (c){
    if (!c.end || toMin(c.end) <= b.s){ if (withOff){ b.off = true; out.push(b); } return; }
    if (toMin(c.end) < b.e){ b.cut = true; b.e = toMin(c.end); }
  }
  out.push(b);
}
function dayBlocks(date, withOff){
  var out = sleepBlocks(date);
  var dow = dowMon(date), key = ymd(date);
  S.fixed.forEach(function(f){
    f.slots.forEach(function(sl){
      if (sl.days.indexOf(dow) >= 0) pushOcc(out, key, { s: toMin(sl.start), e: toMin(sl.end), type: 'fixed', title: f.title, place: f.place, color: f.color, fid: f.id, ref: 'f:' + f.id + ':' + sl.start }, withOff);
    });
  });
  S.settings.meals.forEach(function(ml){
    var t = mealTime(ml, dow);
    if (t) pushOcc(out, key, { s: toMin(t.start), e: toMin(t.end), type: 'meal', title: ml.title, mid: ml.id, ref: 'm:' + ml.id }, withOff);
  });
  S.events.forEach(function(ev){
    if (ev.date === key && !ev.allDay) out.push({ s: toMin(ev.start), e: toMin(ev.end), type: 'event', title: ev.title, place: ev.place, color: ev.color, eid: ev.id });
  });
  return out;
}
function clipLen(blocks, lo, hi, type){
  var iv = [];
  blocks.forEach(function(b){
    if (type && b.type !== type) return;
    var s = Math.max(b.s, lo), e = Math.min(b.e, hi);
    if (e > s) iv.push([s, e]);
  });
  return unionLen(iv);
}
/* 두 시각 사이에서 수면·고정·변동 일정을 뺀 순수 빈 시간(분) */
function freeBetween(from, to){
  if (to <= from) return 0;
  var total = 0, d = sod(from), last = sod(to);
  for (var i = 0; i < 400 && d <= last; i++, d = addDays(d, 1)){
    var lo = Math.max(0, Math.floor((from - d) / 60000)), hi = Math.min(1440, Math.floor((to - d) / 60000));
    if (hi <= lo) continue;
    total += (hi - lo) - clipLen(dayBlocks(d), lo, hi);
  }
  return total;
}
/* 그날 아침 기상 시각(분). 수면 설정이 없으면 0시. */
function wakeMin(date){
  var bl = sleepBlocks(date).sort(function(a, b){ return a.s - b.s; });
  for (var i = 0; i < bl.length; i++) if (bl[i].e < 1440) return bl[i].e;
  return 0;
}
function wakeMoment(date){ return new Date(sod(date).getTime() + wakeMin(date) * 60000); }
function nextBedtime(now){
  var today = sod(now);
  for (var k = -1; k < 8; k++){
    var d = addDays(today, k), cfg = sleepCfg(dowMon(d)), b = toMin(cfg.start), w = toMin(cfg.end);
    if (b === w) continue;
    var t = new Date((b > w ? d : addDays(d, 1)).getTime() + b * 60000);
    if (t > now) return { t: t, label: cfg.start };
  }
  return { t: addDays(today, 1), label: '' };
}

function renderTodos(now){
  var today = sod(now);
  var open = S.todos.filter(function(t){ return !t.done; });
  var done = S.todos.filter(function(t){ return t.done; }).sort(function(a, b){ return b.doneAt - a.doneAt; });
  var withDue = open.filter(function(t){ return t.due; }).sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
  var noDue = open.filter(function(t){ return !t.due; });
  var cum = 0, info = {};

    var end = addDays(parseYmd(t.due), 1), over = end <= now;
    var free = over ? 0 : freeBetween(now, end);
    cum += t.est || 0;
    info[t.id] = { free: free, over: over, short: (!over && t.est > 0 && cum > free) ? cum - free : 0, dd: Math.round((parseYmd(t.due) - today) / 86400000) };
  });
  var estSum = open.reduce(function(a, t){ return a + (t.est || 0); }, 0);

    }

      '<button type="button" class="todo-main" data-act="editTodo" data-id="' + esc(t.id) + '"><span class="todo-title">' + esc(t.title) + '</span>' + (meta ? '<span class="todo-meta">' + meta + '</span>' : '') + '</button></li>';
  }

  $('#doneWrap').innerHTML = done.length
    ? '<details class="done-box" id="doneBox"' + (ui.doneOpen ? ' open' : '') + '><summary>완료 ' + done.length + '개</summary><ul>' + done.map(row).join('') + '</ul><button type="button" class="btn btn-sm btn-ghost" data-act="clearDone">완료한 항목 모두 지우기</button></details>'
    : '';

function clockStr(ms){ var sct = Math.floor(ms / 1000), h = Math.floor(sct / 3600), m = Math.floor(sct % 3600 / 60), ss = sct % 60; return (h ? h + ':' : '') + (h ? p2(m) : String(m)) + ':' + p2(ss); }

}
function availToday(){

}
function hhmmOf(ms){ var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function timerSubjects(){

function renderTimer(){

  var h = '<div class="sec-head"><h2>순공 타이머</h2><span class="sub">오늘 <b class="mono" id="timerStudied">' + durKo(studied) + '</b> / 가능 ' + durKo(avail) + ' · <b id="timerPct">' + pct + '%</b></span></div>' +

function mealSummary(ml){
  var s = daysLabel(ml.days) + ' ' + ml.start + '–' + ml.end;
  ml.ex.forEach(function(x){ if (ml.days.indexOf(x.day) >= 0) s += ' / ' + DOW[x.day] + '만 ' + x.start + '–' + x.end; });
  return s;
}
function overlapsFixed(d, s, e){
  return S.fixed.some(function(f){ return f.slots.some(function(sl){ return sl.days.indexOf(d) >= 0 && Math.min(e, toMin(sl.end)) > Math.max(s, toMin(sl.start)); }); });
}
/* 식사 시간이 고정 일정과 겹치는 요일, 그리고 겹치지 않는 대안 시간 */
function mealConflicts(ml){
  var out = [];
  ml.days.slice().sort().forEach(function(d){
    var t = mealTime(ml, d); if (!t || !isT(t.start) || !isT(t.end)) return;
    var ms = toMin(t.start), me = toMin(t.end), dur = me - ms; if (dur <= 0) return;
    S.fixed.forEach(function(f){ f.slots.forEach(function(sl){
      if (sl.days.indexOf(d) < 0) return;
      var cs = toMin(sl.start), ce = toMin(sl.end), ov = Math.min(me, ce) - Math.max(ms, cs);
      if (ov <= 0) return;
      var sug = null;
      if (ce + dur <= 1439 && !overlapsFixed(d, ce, ce + dur)) sug = [ce, ce + dur];
      else if (cs - dur >= 0 && !overlapsFixed(d, cs - dur, cs)) sug = [cs - dur, cs];
      out.push({ day: d, title: f.title, start: sl.start, end: sl.end, overlap: ov, sug: sug });
    }); });
  });
  return out;
}
function openMeal(item){
  kind = 'meal';
  draft = item ? clone(item) : (S.settings.meals.length
    ? { id: '', title: '저녁', days: [0,1,2,3,4], start: '18:00', end: '19:00', ex: [] }
    : { id: '', title: '점심', days: [0,1,2,3,4], start: '13:00', end: '14:00', ex: [] });
  drawMeal(); showSheet();
}
function chipRow(act, isOn, extra){
  return '<div class="daychips">' + DOW.map(function(n, d){
    return '<button type="button" class="daychip" data-act="' + act + '" data-d="' + d + '"' + (extra || '') + ' aria-pressed="' + (isOn(d) ? 'true' : 'false') + '">' + n + '</button>';
  }).join('') + '</div>';
}
function drawMeal(){
  var h = '<h2 id="sheetTitle">식사 시간 ' + (draft.id ? '수정' : '추가') + '</h2><p class="hint">순공 시간을 계산할 때 매주 이 시간을 뺍니다</p>' +
    '<label class="field"><span>이름</span><input type="text" id="ml-title" maxlength="20" value="' + esc(draft.title) + '" placeholder="예: 점심"></label>' +
    '<div class="field"><span>요일</span>' + chipRow('mealDay', function(d){ return draft.days.indexOf(d) >= 0; }) + '</div>' +
    '<div class="field"><span>시간</span><div class="slot-time"><input type="time" id="ml-s" value="' + esc(draft.start) + '" aria-label="시작 시간"><span>–</span><input type="time" id="ml-e" value="' + esc(draft.end) + '" aria-label="종료 시간"><span></span></div></div>' +
    '<div class="field"><span>요일별 예외</span><p class="note">수업과 겹치는 요일만 다른 시간에 먹도록 바꿉니다.</p>';
  draft.ex.forEach(function(x, i){
    h += '<div class="slot">' + chipRow('exDay', function(d){ return x.day === d; }, ' data-i="' + i + '"') +
      '<div class="slot-time"><input type="time" id="ml-xs-' + i + '" value="' + esc(x.start) + '" aria-label="예외 시작 시간"><span>–</span><input type="time" id="ml-xe-' + i + '" value="' + esc(x.end) + '" aria-label="예외 종료 시간"><button type="button" class="rm" data-act="rmEx" data-i="' + i + '" aria-label="이 예외 삭제">×</button></div></div>';
  });
  h += '<button type="button" class="btn btn-sm" data-act="addEx" style="justify-self:start">+ 예외 추가</button></div><div id="mealConf" class="conf-box"></div>' + actions(!!draft.id);
  form.innerHTML = h;
  drawMealConf();
}
function readMeal(){
  draft.title = $('#ml-title').value.trim(); draft.start = $('#ml-s').value; draft.end = $('#ml-e').value;
  draft.ex.forEach(function(x, i){ x.start = $('#ml-xs-' + i).value; x.end = $('#ml-xe-' + i).value; });
}
function drawMealConf(){
  var box = $('#mealConf'); if (!box) return;
  var cs = mealConflicts(draft);
  box.innerHTML = cs.length ? '<p class="conf-h">시간표와 겹치는 요일</p>' + cs.map(function(c){
    return '<div class="conf"><span><b>' + DOW[c.day] + '</b> ' + esc(c.title) + ' <span class="mono">' + c.start + '–' + c.end + '</span> · ' + durKo(c.overlap) + ' 겹침</span>' +
      (c.sug ? '<button type="button" class="btn btn-sm" data-act="exFromConflict" data-d="' + c.day + '" data-s="' + fromMin(c.sug[0]) + '" data-e="' + fromMin(c.sug[1]) + '">' + DOW[c.day] + '요일만 ' + fromMin(c.sug[0]) + '–' + fromMin(c.sug[1]) + '</button>' : '') + '</div>';
  }).join('') : '';
}
function submitMeal(){
  readMeal();
  if (!draft.title) draft.title = '식사';
  if (!draft.days.length) return sheetErr('요일을 하나 이상 고르세요.');
  if (!isT(draft.start) || !isT(draft.end)) return sheetErr('시작과 종료 시간을 입력하세요.');
  if (toMin(draft.end) <= toMin(draft.start)) return sheetErr('종료 시간이 시작 시간보다 늦어야 합니다.');
  var seen = {};
  for (var i = 0; i < draft.ex.length; i++){
    var x = draft.ex[i];
    if (x.day < 0) return sheetErr('예외를 적용할 요일을 고르세요.');
    if (draft.days.indexOf(x.day) < 0) return sheetErr(DOW[x.day] + '요일은 식사 요일에 없습니다. 위에서 요일을 켜거나 이 예외를 지우세요.');
    if (seen[x.day]) return sheetErr(DOW[x.day] + '요일 예외가 두 개입니다. 하나만 남기세요.');
    seen[x.day] = 1;
    if (!isT(x.start) || !isT(x.end) || toMin(x.end) <= toMin(x.start)) return sheetErr('예외 시간도 종료가 시작보다 늦어야 합니다.');
  }
  var ml = cleanMeals([draft])[0], at = draft.id ? S.settings.meals.findIndex(function(m){ return m.id === draft.id; }) : -1;
  if (at >= 0) S.settings.meals[at] = ml; else { if (!draft.id) ml.id = uid(); S.settings.meals.push(ml); }
  closeSheet(); save('settings');
}
function submitSheet(){
  var i;
  if (kind === 'meal') return submitMeal();
  if (kind === 'manual') return submitManual();
  if (kind === 'fixed'){
    readFixed();
    if (!draft.title) return sheetErr('이름을 입력하세요.');
    for (i = 0; i < draft.slots.length; i++){
      var sl = draft.slots[i];
      if (!sl.days.length) return sheetErr('요일을 하나 이상 고르세요.');
      if (!isT(sl.start) || !isT(sl.end)) return sheetErr('시작과 종료 시간을 입력하세요.');
      if (toMin(sl.end) <= toMin(sl.start)) return sheetErr('종료 시간이 시작 시간보다 늦어야 합니다.');
    }
    var fx = cleanFixed([draft])[0];
    if (draft.id){ i = S.fixed.findIndex(function(f){ return f.id === draft.id; }); if (i >= 0) S.fixed[i] = fx; else S.fixed.push(fx); }
    else { fx.id = uid(); S.fixed.push(fx); }
    closeSheet(); save('fixed');
  } else if (kind === 'event'){
    draft.title = $('#ev-title').value.trim(); draft.date = $('#ev-date').value; draft.allDay = !$('#ev-timed').checked;
    draft.start = $('#ev-start').value; draft.end = $('#ev-end').value; draft.place = $('#ev-place').value.trim();
    if (!draft.title) return sheetErr('이름을 입력하세요.');
    if (!isD(draft.date)) return sheetErr('날짜를 고르세요.');
    if (!draft.allDay){
      if (!isT(draft.start) || !isT(draft.end)) return sheetErr('시작과 종료 시간을 입력하세요.');
      if (toMin(draft.end) <= toMin(draft.start)) return sheetErr('종료 시간이 시작 시간보다 늦어야 합니다.');
    }
    var ev = cleanEvents([draft])[0];
    if (draft.id){ i = S.events.findIndex(function(e){ return e.id === draft.id; }); if (i >= 0) S.events[i] = ev; else S.events.push(ev); }
    else { ev.id = uid(); S.events.push(ev); }
    var dd = parseYmd(ev.date); ui.sel = ev.date; ui.week = mondayOf(dd); ui.ttWeek = mondayOf(dd); ui.month = new Date(dd.getFullYear(), dd.getMonth(), 1);
    closeSheet(); save('events');
  } else if (kind === 'todo'){
    var title = $('#td-title').value.trim();
    if (!title) return sheetErr('할 일을 입력하세요.');
    i = S.todos.findIndex(function(t){ return t.id === draft.id; });
    if (i >= 0){ S.todos[i].title = title; S.todos[i].due = isD($('#td-due').value) ? $('#td-due').value : ''; var h = parseFloat($('#td-est').value); S.todos[i].est = h > 0 ? Math.round(h * 60) : 0; }
    closeSheet(); save('todos');
  } else if (kind === 'settings'){
    var rows = readSleepRows();
    for (i = 0; i < 7; i++) if (!isT(rows[i].start) || !isT(rows[i].end)) return sheetErr(DOW[i] + '요일의 취침과 기상 시간을 입력하세요.');
    S.settings.sleep = rows;
    closeSheet(); save('settings');
  }
}
function deleteDraft(){
  if (!armed){ armed = true; var b = $('#sheet-del'); if (b) b.textContent = '한 번 더 누르면 삭제'; return; }
  var id = draft.id, k = kind;
  closeSheet();
  if (k === 'fixed'){ S.fixed = S.fixed.filter(function(f){ return f.id !== id; }); save('fixed'); }
  else if (k === 'event'){ S.events = S.events.filter(function(e){ return e.id !== id; }); save('events'); }
  else if (k === 'todo'){ S.todos = S.todos.filter(function(t){ return t.id !== id; }); save('todos'); }
  else if (k === 'meal'){ S.settings.meals = S.settings.meals.filter(function(m){ return m.id !== id; }); save('settings'); }
}

/* ───────── events ───────── */
document.addEventListener('click', function(e){
  if (e.target === dlg){ closeSheet(); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act, id = el.dataset.id, i, t;
  switch (act){
    case 'tab': ui.tab = el.dataset.tab; lsSet('tab', ui.tab); render(); window.scrollTo(0, 0); break;
    case 'settings': openSettings(); break;
    case 'heroGo': heroGo(+el.dataset.i); break;
    case 'heroPrev': heroGo(Math.max(0, ui.heroIdx - 1)); break;
    case 'heroNext': heroGo(Math.min(6, ui.heroIdx + 1)); break;
    case 'retrySync': if (gistOn()){ gist.err = ''; gistPull('manual'); } else if (store.error){ store.error = false; DOCS.forEach(flush); } break;
    case 'gistConnect': gistConnect(); break;
    case 'gistNow': gist.err = ''; gistMsg('동기화 중…'); gistPull('manual').then(function(){ gistMsg(gist.err ? '동기화하지 못했습니다. 연결을 확인하세요.' : '동기화했습니다.'); }); break;
    case 'gistOff': gist.token = ''; gist.id = ''; gist.dirty = false; gist.err = ''; gistPersist(); closeSheet(); openSettings(); paintSync(); break;
    case 'toggleTodo':
      t = S.todos.find(function(x){ return x.id === id; });
      if (t){ t.done = !t.done; t.doneAt = t.done ? Date.now() : 0; save('todos'); }
      break;
    case 'editTodo': t = S.todos.find(function(x){ return x.id === id; }); if (t) openTodo(t); break;
    case 'clearDone': S.todos = S.todos.filter(function(x){ return !x.done; }); ui.doneOpen = false; save('todos'); break;
    case 'addFixed': openFixed(null); break;
    case 'editFixed': t = S.fixed.find(function(x){ return x.id === id; }); if (t) openFixed(t, null, el.dataset.ref ? { date: el.dataset.date, ref: el.dataset.ref } : null); break;
    case 'ttAdd':
      var r = el.getBoundingClientRect(), st = ttStart * 60 + Math.floor(((e.clientY - r.top) / HH * 60) / 30) * 30;
      st = Math.max(0, Math.min(st, 23 * 60));
      openPick(+el.dataset.day, el.dataset.date, fromMin(st), fromMin(Math.min(st + 75, 1439)));
      break;
    case 'addEvent':
      if (el.dataset.timed){ var tn = new Date(); openEvent(null, ymd(mondayOf(tn)) === ymd(ui.ttWeek) ? ymd(tn) : ymd(ui.ttWeek), true); }
      else openEvent(null, el.dataset.date || (ui.evView === 'month' ? ui.sel : ''), false);
      break;
    case 'timeEvent': t = S.events.find(function(x){ return x.id === id; }); if (t) openEvent(t, null, true); break;
    case 'pickFixed': var pf = draft; openFixed(null, { days: [pf.day], start: pf.start, end: pf.end }); break;
    case 'pickEvent': var pe = draft; openEvent(null, pe.date, true, { start: pe.start, end: pe.end }); break;
    case 'ttPrev': ui.ttWeek = addDays(ui.ttWeek, -7); renderTimetable(); break;
    case 'ttNext': ui.ttWeek = addDays(ui.ttWeek, 7); renderTimetable(); break;
    case 'ttToday': ui.ttWeek = mondayOf(new Date()); renderTimetable(); break;
    case 'occCutNow': var cn = new Date(); setCut(ymd(cn), el.dataset.ref, fromMin(cn.getHours() * 60 + cn.getMinutes())); break;
    case 'occSkip': setCut(el.dataset.date, el.dataset.ref, ''); break;
    case 'occUndo': setCut(el.dataset.date, el.dataset.ref, null); break;
    case 'occToggle': var oc = sheetOcc; closeSheet(); if (oc) setCut(oc.date, oc.ref, cutFor(oc.date, oc.ref) ? null : ''); break;
    case 'editEvent': t = S.events.find(function(x){ return x.id === id; }); if (t) openEvent(t); break;
    case 'evView': ui.evView = el.dataset.v; renderEvents(); break;
    case 'evPrev': case 'evNext':
      i = act === 'evPrev' ? -1 : 1;
      if (ui.evView === 'week') ui.week = addDays(ui.week, 7 * i); else ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + i, 1);
      renderEvents(); break;
    case 'evToday':
      var n = new Date(); ui.week = mondayOf(n); ui.month = new Date(n.getFullYear(), n.getMonth(), 1); ui.sel = ymd(n); renderEvents(); break;
    case 'selDay': ui.sel = el.dataset.date; renderEvents(); break;
    case 'pickColor':
      draft.color = +el.dataset.c;
      form.querySelectorAll('.sw').forEach(function(s){ s.setAttribute('aria-pressed', s === el ? 'true' : 'false'); });
      break;
    case 'toggleDay':
      var sl = draft.slots[+el.dataset.i], d = +el.dataset.d, at = sl.days.indexOf(d);
      if (at >= 0) sl.days.splice(at, 1); else sl.days.push(d);
      el.setAttribute('aria-pressed', at >= 0 ? 'false' : 'true'); sheetErr('');
      break;
    case 'addSlot': readFixed(); var lastSl = draft.slots[draft.slots.length - 1]; draft.slots.push({ days: [], start: lastSl.start, end: lastSl.end }); drawFixed(); break;
    case 'rmSlot': readFixed(); draft.slots.splice(+el.dataset.i, 1); drawFixed(); break;
    case 'addMeal': openMeal(null); break;
    case 'editMeal': t = S.settings.meals.find(function(x){ return x.id === id; }); if (t) openMeal(t); break;
    case 'mealDay':
      var md = +el.dataset.d, mat = draft.days.indexOf(md);
      if (mat >= 0) draft.days.splice(mat, 1); else draft.days.push(md);
      el.setAttribute('aria-pressed', mat >= 0 ? 'false' : 'true'); sheetErr(''); readMeal(); drawMealConf();
      break;
    case 'exDay': readMeal(); draft.ex[+el.dataset.i].day = +el.dataset.d; drawMeal(); break;
    case 'addEx': readMeal(); draft.ex.push({ day: -1, start: draft.start, end: draft.end }); drawMeal(); break;
    case 'rmEx': readMeal(); draft.ex.splice(+el.dataset.i, 1); drawMeal(); break;
    case 'exFromConflict':
      readMeal();
      var xd = +el.dataset.d, xat = draft.ex.findIndex(function(x){ return x.day === xd; }), nx = { day: xd, start: el.dataset.s, end: el.dataset.e };
      if (xat >= 0) draft.ex[xat] = nx; else draft.ex.push(nx);
      drawMeal();
      break;
    case 'bgClear': bg.url = ''; bgSave(); applyBg(); closeSheet(); openSettings(); break;
    case 'timerPick': if ($('#timer-subject')){ $('#timer-subject').value = el.dataset.s; $('#timer-subject').focus(); } break;
    case 'timerPause': if (S.study.active && S.study.active.running){ S.study.active.acc = elapsedMs(S.study.active); S.study.active.running = false; save('study'); } break;
    case 'timerResume': if (S.study.active && !S.study.active.running){ S.study.active.startAt = Date.now(); S.study.active.running = true; save('study'); } break;
    case 'timerStop': timerStop(); break;
    case 'timerDel':
      if (timerDelArmed !== id){ timerDelArmed = id; el.textContent = '삭제?'; el.style.width = 'auto'; el.style.fontSize = '12px'; break; }
      timerDelArmed = ''; S.study.log = S.study.log.filter(function(x){ return x.id !== id; }); save('study'); break;
    case 'timerManual': openManual(); break;
    case 'sleepAll':
      var sa = $('#st-all-s').value, se = $('#st-all-e').value;
      if (!isT(sa) || !isT(se)){ sheetErr('먼저 위의 취침·기상 시간을 입력하세요.'); break; }
      for (var sd = 0; sd < 7; sd++){ $('#st-s-' + sd).value = sa; $('#st-e-' + sd).value = se; }
      sheetErr(''); sleepLen();
      break;
    case 'bkCopy': backupCopy(); break;
    case 'bkShowImport': backupShowImport(); break;
    case 'bkImport': backupImport(); break;
    case 'cancel': closeSheet(); break;
    case 'del': deleteDraft(); break;
  }
});
form.addEventListener('submit', function(e){ e.preventDefault(); submitSheet(); });
form.addEventListener('change', function(e){ if (e.target.id === 'bg-file') bgPick(e.target.files && e.target.files[0]); });
form.addEventListener('input', function(e){
  if (e.target.id === 'bg-op'){ bg.op = (+e.target.value) / 100; var v = $('#bg-op-val'); if (v) v.textContent = e.target.value + '%'; bgSave(); applyBg(); }
  if (e.target.id === 'ev-timed'){ $('#ev-start').disabled = $('#ev-end').disabled = !e.target.checked; }
  if (kind === 'settings') sleepLen();
  if (kind === 'meal'){ readMeal(); drawMealConf(); }
});
dlg.addEventListener('close', function(){ kind = null; draft = null; });
$('#todoAdd').addEventListener('submit', function(e){
  e.preventDefault();
  var ti = $('#todo-new-title'), title = ti.value.trim();
  if (!title){ ti.focus(); return; }
  var due = $('#todo-new-due').value, h = parseFloat($('#todo-new-est').value);
  S.todos.push({ id: uid(), title: title.slice(0, 120), due: isD(due) ? due : '', est: h > 0 ? Math.round(h * 60) : 0, done: false, doneAt: 0 });
  ti.value = ''; $('#todo-new-est').value = '';
  save('todos');
});
document.addEventListener('toggle', function(e){ if (e.target && e.target.id === 'doneBox') ui.doneOpen = e.target.open; }, true);

function heroGo(i){
  var tr = $('#heroTrack'); if (!tr) return;
  ui.heroIdx = i; heroChips();
  tr.scrollTo({ left: i * tr.clientWidth, behavior: 'smooth' });
}
function heroChips(){
  var chips = document.querySelectorAll('#heroDays .hday');
  chips.forEach(function(c){ c.classList.toggle('on', +c.dataset.i === ui.heroIdx); });
}
var heroScrollT = null;
document.addEventListener('scroll', function(e){
  var t = e.target; if (!t || t.id !== 'heroTrack') return;
  clearTimeout(heroScrollT);
  heroScrollT = setTimeout(function(){
    var idx = Math.max(0, Math.min(6, Math.round(t.scrollLeft / Math.max(1, t.clientWidth))));
    if (idx !== ui.heroIdx){ ui.heroIdx = idx; heroChips(); }
  }, 80);
}, true);

/* 시계가 흐르면 남은 시간도 바뀐다 (읽기만, 저장 없음) */
function tick(){ if (!dlg.open && document.visibilityState !== 'hidden' && ui.tab !== 'events') render(); }
setInterval(tick, 30000);
setInterval(timerTick, 1000);
document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'timerStart'){ e.preventDefault(); var v = $('#timer-subject').value.trim(); timerStart(v || '공부'); }
});
applyBg();
document.addEventListener('visibilitychange', tick);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') gistPull('auto'); });
window.addEventListener('online', function(){ gistPull('manual'); });
window.addEventListener('focus', function(){ gistPull('auto'); });
setInterval(function(){ if (document.visibilityState !== 'hidden') gistPull('auto'); }, 45000);

render();
initCloud();
if (gistOn()) gistPull('manual');
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!had || document.querySelector('.upd')) return;
      var bar = document.createElement('div'); bar.className = 'upd';
      bar.innerHTML = '<span>새 버전이 준비됐습니다</span><button type="button">새로고침</button>';
      bar.querySelector('button').onclick = function () { location.reload(); };
      document.body.appendChild(bar);
    });
  });
}
</script>
